<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login</title>

    <link rel="stylesheet" href="login.css">

</head>


<body>

    <div class="login-container">

        <div class="login-card">

            <h1>Login</h1>

            <p class="subtitle">
                Login to your account
            </p>


            <form id="loginForm">

                <div class="input-box">

                    <label>Email</label>

                    <input
                        type="email"
                        id="email"
                        placeholder="Enter email"
                    >

                    <small id="erroremail"></small>

                </div>


                <div class="input-box">

                    <label>Password</label>

                    <input
                        type="password"
                        id="password"
                        placeholder="Enter password"
                    >

                    <small id="errorpassword"></small>

                </div>


                <p id="loginError"></p>


                <button type="submit">
                    Login
                </button>

            </form>


            <p class="signup-text">

                Don't have an account?

                <a href="signup.html">
                    Sign Up
                </a>

            </p>

        </div>

    </div>


    <script src="login.js"></script>

</body>

</html>
